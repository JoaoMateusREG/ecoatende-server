bind 0.0.0.0
port 6379
protected-mode yes
requirepass "root131004"

# Persistencia: AOF reduz perda de sessoes apos restart/crash.
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Snapshot RDB como camada adicional de recuperacao.
save 900 1
save 300 10
save 60 10000

# Evita interromper escrita se snapshot falhar em ambiente local.
stop-writes-on-bgsave-error no
rdbcompression yes
rdbchecksum yes
dir /data
