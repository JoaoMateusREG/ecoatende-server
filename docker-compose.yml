# Docker Compose para Deploy no Coolify com Banco de Dados e Redis gerenciados pelo Coolify
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecoatende-api
    restart: unless-stopped
    expose:
      - "9868"
    env_file:
      - path: .env
        required: false
    networks:
      - coolify

networks:
  coolify:
    external: true
